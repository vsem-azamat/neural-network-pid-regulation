# Thermal plant with radiative loss.
#
# Same plant class as thermal.yml, made nonlinear. Radiation adds an effective
# loss coefficient of 4*sigma*T^3, so the plant's own gain and time constant are
# strong functions of where it is operating:
#
#     T = 320 K  ->  h_eff ~ 23 W/K,  tau ~ 43 s
#     T = 500 K  ->  h_eff ~ 60 W/K,  tau ~ 17 s
#
# A controller tuned at one end of that range is badly detuned at the other,
# which is the textbook industrial reason to schedule gains on temperature.
#
# The heater is sized so the top of the setpoint range is actually reachable:
# holding 500 K needs ~7.6 kW once radiation is included, against ~2.1 kW for
# the purely convective plant.
plant: thermal

learning:
  dt: 0.5

  lstm:
    train_time: 600.0
    num_epochs: 80
    sequence_length: 1
    tbptt_window: 25
    warm_up_steps: 25
    grad_clip: 1.0
    loss_target: plant
    overshoot_weight: 0.5
    effort_weight: 0.05
    gain_rate_weight: 0.02
    optimizer:
      name: adam
      lr: 0.003
    scheduler:
      gamma: 0.98
    model:
      hidden_size: 48
      num_layers: 1

  rbf:
    num_epochs: 400
    batch_size: 128
    lr: 0.005
    num_trajectories: 300
    trajectory_steps: 150
    validation_split: 0.2
    model:
      hidden_size: 80

control:
  output_min: 0.0
  output_max: 9000.0
  # Pole placement on the plant linearised at ambient. Deliberately NOT the
  # output of the identification-based rule: applied to the radiative plant, the
  # two-point fit describes a response that is not first-order and returns
  # Kp=498, Kd=539. That is a genuine property of using a linear rule on a
  # nonlinear plant - and one of the reasons gain scheduling exists - so it stays
  # in the comparison as the "classical" arm, but it is not something to start
  # training from.
  initial_gains: [44.0, 1.6, 0.0]
  gain_ceiling: [600.0, 40.0, 50.0]
  error_scale: 30.0
  tuning_step_input: 2000.0

scenario:
  setpoint:
    low: 320.0
    high: 500.0
  segment_time:
    low: 80.0
    high: 200.0
  disturbance_scale: 1200.0
  disturbance_hold: 40.0
  randomize_plant:
    thermal_capacity:          {low: 700.0, high: 1600.0}
    heat_transfer_coefficient: {low: 6.0,   high: 18.0}

system:
  thermal_capacity: 1000.0
  heat_transfer_coefficient: 10.0
  initial_temperature: 293.15
  ambient_temperature: 293.15
  radiative_coefficient: 1.0e-7
