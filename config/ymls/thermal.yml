# Lumped-capacity thermal plant: first-order, no dead time.
#
# tau = C/h = 100 s for the nominal plant, so min_dt is far larger than any
# sensible sample time; dt is set by the control bandwidth we want, not by
# stability.
plant: thermal

learning:
  dt: 0.5

  lstm:
    train_time: 600.0
    num_epochs: 60
    # One sample per step: the memory lives in the LSTM's hidden state, which
    # is what a recurrent network is for. A 40-sample window made the carried
    # hidden state change the predicted gains by exactly 0.0 - the window already
    # held everything it could remember - so the loop paid 40x the work per
    # control step for a recurrence that was doing nothing.
    # tests/test_review_findings.py fails if this window grows back past the
    # point where the hidden state stops mattering.
    sequence_length: 1
    tbptt_window: 20
    warm_up_steps: 20
    grad_clip: 1.0
    loss_target: plant
    overshoot_weight: 0.5
    effort_weight: 0.05
    gain_rate_weight: 0.02
    optimizer:
      name: adam
      lr: 0.003
    scheduler:
      gamma: 0.97
    model:
      hidden_size: 48
      num_layers: 1

  rbf:
    num_epochs: 400
    batch_size: 128
    lr: 0.005
    num_trajectories: 300
    trajectory_steps: 120
    validation_split: 0.2
    model:
      hidden_size: 60

control:
  # A heater cannot cool: the lower limit is 0 W. The plant loses heat to
  # ambient on its own, which is what brings the temperature back down.
  output_min: 0.0
  output_max: 4000.0
  # IMC tuning for the nominal plant, as `tuning.tune(..., "auto")` returns it.
  # Kept in sync with the tuner: the warm start claims to begin at the classical
  # gains, which is only true if these are the classical gains.
  initial_gains: [100.0, 1.01, 0.0]
  gain_ceiling: [300.0, 4.0, 20.0]
  error_scale: 30.0
  tuning_step_input: 1000.0

scenario:
  # Kelvin. Ambient is 293.15 K, so these are setpoints from ~7 to ~57 degrees
  # above room temperature - reachable with the 4 kW heater given h = 10 W/K.
  setpoint:
    low: 300.0
    high: 350.0
  segment_time:
    low: 80.0
    high: 200.0
  # ~15% of the actuator range.
  disturbance_scale: 600.0
  disturbance_hold: 40.0
  randomize_plant:
    thermal_capacity:          {low: 700.0, high: 1600.0}
    heat_transfer_coefficient: {low: 6.0,   high: 18.0}

system:
  thermal_capacity: 1000.0
  heat_transfer_coefficient: 10.0
  initial_temperature: 293.15
  ambient_temperature: 293.15
